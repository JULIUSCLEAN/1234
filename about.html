<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="About this little corner of the web." />
    <title>About · Hello World</title>
    <style>
      :root { color-scheme: dark; --ink:#f8f7ff; --muted:#b9b5d2; --violet:#a78bfa; --cyan:#5eead4; }
      * { box-sizing: border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 18% 20%,rgba(94,234,212,.18),transparent 27rem),radial-gradient(circle at 82% 78%,rgba(167,139,250,.24),transparent 30rem),#0d0b1a; }
      .orb { position:fixed; width:18rem; aspect-ratio:1; border-radius:50%; opacity:.32; background:linear-gradient(135deg,var(--cyan),var(--violet)); animation:drift 12s ease-in-out infinite alternate; }
      .orb:first-child { top:-9rem; right:8%; }.orb:nth-child(2) { bottom:-12rem; left:5%; animation-delay:-5s; }
      main { width:min(92vw,46rem); position:relative; padding:clamp(5rem,9vw,6rem) clamp(2rem,7vw,5rem) clamp(2rem,7vw,5rem); border:1px solid rgba(255,255,255,.15); border-radius:2rem; background:rgba(24,20,47,.7); box-shadow:0 2rem 5rem rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.08); backdrop-filter:blur(18px); animation:enter .8s cubic-bezier(.22,1,.36,1) both; }
      nav { position:absolute; top:1.25rem; right:1.5rem; display:flex; gap:1rem; } nav a { color:var(--muted); font-size:.9rem; text-decoration:none; } nav a:hover,nav a[aria-current="page"] { color:var(--cyan); }
      .eyebrow { margin:0 0 1.15rem; color:var(--cyan); font-size:.78rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(3rem,9vw,5.5rem); line-height:.94; letter-spacing:-.07em; background:linear-gradient(120deg,#fff 15%,var(--cyan) 50%,var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; } p { color:var(--muted); font-size:1.1rem; line-height:1.7; } .values { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-top:2rem; } .value { padding:1rem; border:1px solid rgba(255,255,255,.1); border-radius:1rem; background:rgba(255,255,255,.04); } .value strong { display:block; color:var(--cyan); margin-bottom:.35rem; } .value span { color:var(--muted); font-size:.87rem; line-height:1.4; display:block; }
      @keyframes enter { from { opacity:0; transform:translateY(1.5rem) scale(.98); } to { opacity:1; transform:none; } } @keyframes drift { to { transform:translate(3rem,2rem) rotate(25deg); } } @media (max-width:560px) { .values { grid-template-columns:1fr; } } @media (prefers-reduced-motion:reduce) { * { animation-duration:.01ms !important; } }
    </style>
  </head>
  <body>
    <div class="orb"></div><div class="orb"></div>
    <main>
      <nav aria-label="Primary navigation"><a href="hello-world.html">Home</a><a href="about.html" aria-current="page">About</a><a href="contact.html">Contact</a></nav>
      <p class="eyebrow">The story so far</p>
      <h1>Made to begin.</h1>
      <p>This is a small, thoughtful space for big ideas. It started with a simple greeting—and is ready to become whatever you imagine next.</p>
      <section class="values" aria-label="Our values">
        <div class="value"><strong>Curious</strong><span>Always exploring what could be.</span></div>
        <div class="value"><strong>Human</strong><span>Built with clarity and care.</span></div>
        <div class="value"><strong>Bright</strong><span>Making every start feel exciting.</span></div>
      </section>
    </main>
  </body>
</html>
