<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A polished hello world page." />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8f7ff;
        --muted: #b9b5d2;
        --violet: #a78bfa;
        --cyan: #5eead4;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 20%, rgba(94, 234, 212, .18), transparent 27rem),
          radial-gradient(circle at 82% 78%, rgba(167, 139, 250, .24), transparent 30rem),
          #0d0b1a;
      }

      .orb {
        position: fixed;
        width: 18rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(1px);
        opacity: .32;
        animation: drift 12s ease-in-out infinite alternate;
        background: linear-gradient(135deg, var(--cyan), var(--violet));
      }

      .orb--one { top: -9rem; right: 8%; }
      .orb--two { bottom: -12rem; left: 5%; animation-delay: -5s; animation-direction: alternate-reverse; }

      main {
        width: min(92vw, 46rem);
        position: relative;
        padding: clamp(2rem, 7vw, 5rem);
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 2rem;
        text-align: center;
        background: rgba(24, 20, 47, .7);
        box-shadow: 0 2rem 5rem rgba(0,0,0,.36), inset 0 1px rgba(255,255,255,.08);
        backdrop-filter: blur(18px);
        animation: enter .8s cubic-bezier(.22, 1, .36, 1) both;
      }

      .eyebrow {
        margin: 0 0 1.15rem;
        color: var(--cyan);
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.75rem);
        line-height: .94;
        letter-spacing: -.07em;
        background: linear-gradient(120deg, #fff 15%, var(--cyan) 50%, var(--violet));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 34rem;
        margin: 1.7rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.18rem);
        line-height: 1.7;
      }

      button {
        margin-top: 2rem;
        padding: .9rem 1.25rem;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        font-weight: 750;
        color: #0d0b1a;
        background: linear-gradient(100deg, var(--cyan), var(--violet));
        box-shadow: 0 .7rem 1.8rem rgba(94, 234, 212, .2);
        transition: transform .2s ease, box-shadow .2s ease;
      }

      button:hover { transform: translateY(-3px); box-shadow: 0 1rem 2.2rem rgba(167, 139, 250, .32); }
      button:active { transform: translateY(0); }

      @keyframes enter { from { opacity: 0; transform: translateY(1.5rem) scale(.98); } to { opacity: 1; transform: none; } }
      @keyframes drift { to { transform: translate(3rem, 2rem) rotate(25deg); } }

      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="orb orb--one"></div>
    <div class="orb orb--two"></div>
    <main>
      <p class="eyebrow">A tiny beginning</p>
      <h1>Hello, World!</h1>
      <p id="message">A fresh page, a bright idea, and an entire universe of possibilities.</p>
      <button type="button" id="greet">Say hello back ✨</button>
    </main>
    <script>
      const messages = [
        "Nice to meet you. Let’s make something remarkable.",
        "The web is waiting for your next great idea.",
        "Hello received. Creative mode: activated."
      ];
      let index = 0;
      document.querySelector("#greet").addEventListener("click", () => {
        document.querySelector("#message").textContent = messages[index++ % messages.length];
      });
    </script>
  </body>
</html>
